name: Validate

on:
  push:
  pull_request:
  # weekly, to catch a download that moved or changed since it was added
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the catalog and every download
        run: python3 scripts/validate.py --download
